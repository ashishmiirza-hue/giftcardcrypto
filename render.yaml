# Render blueprint: EK service mein sab kuch (store + admin + backend)
#   store  -> https://<service>.onrender.com/
#   admin  -> https://<service>.onrender.com/admin/
#   API    -> https://<service>.onrender.com/api/health
# Render dashboard -> New -> Blueprint -> is repo ko chuno.
services:
  - type: web
    name: giftcardcrypto
    runtime: node
    plan: free
    buildCommand: cd store && npm install && npm run build && cd ../admin && npm install && npm run build && cd ../backend && rm -rf node_modules && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NETWORK
        value: bsc
      - key: TRUST_PROXY
        value: "1"
      - key: POLL_INTERVAL_MS
        value: "10000"
      - key: ORDER_TTL_MIN
        value: "30"
      - key: INR_RATE_FALLBACK
        value: "96"
      - key: STORE_NAME
        value: Tohfa
      # Khaali chhodo to free public RPC (https://bsc.drpc.org) use hoga.
      # Ankr: https://rpc.ankr.com/bsc/YOUR_KEY
      - key: RPC_URL
        sync: false
      - key: RECEIVING_WALLET
        sync: false
      - key: REOWN_PROJECT_ID
        sync: false
      - key: ADMIN_KEY
        sync: false
      # ---- AI token billing (contracts/README.md) ----
      - key: BILLING_CONTRACT
        sync: false
      - key: KEEPER_PRIVATE_KEY
        sync: false
      - key: SERVICE_API_KEY
        sync: false
    # Asli customers ke liye: plan "starter" karo aur ye disk lagao, taaki
    # orders/codes restart par delete na hon. Saath mein DB_PATH=/var/data/store.db
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
