# Render blueprint: EK service mein sab kuch (store + admin + backend)
#   store  -> https://<service>.onrender.com/
#   admin  -> https://<service>.onrender.com/admin/
#   API    -> https://<service>.onrender.com/api/...
# Render dashboard -> New -> Blueprint -> is repo ko chuno.
# Secret values (RPC_URL, RECEIVING_WALLET, REOWN_PROJECT_ID, ADMIN_KEY) Render tumse poochega.
services:
  - type: web
    name: tohfa-backend
    runtime: node
    buildCommand: cd store && npm install && npm run build && cd ../admin && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NETWORK
        value: base-sepolia
      - key: TRUST_PROXY
        value: "1"
      - key: CONFIRMATIONS
        value: "2"
      - key: POLL_INTERVAL_MS
        value: "10000"
      - key: ORDER_TTL_MIN
        value: "30"
      - key: STORE_NAME
        value: Tohfa
      - key: RPC_URL
        sync: false
      - key: RPC_URL_2
        sync: false
      - key: RECEIVING_WALLET
        sync: false
      - key: REOWN_PROJECT_ID
        sync: false
      - key: ADMIN_KEY
        sync: false
    # Live jaane par: plan "starter" karo aur ye disk lagao, taaki orders/codes
    # restart ya redeploy par delete na hon. Saath mein DB_PATH=/var/data/store.db set karo.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
